[package]
name = "liman"
description = "A terminal file manager with the feel of a GUI file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
liman-core.workspace = true
liman-widgets.workspace = true
# Code tabs (fm-research ADR 0011): the fener editor, MIT.
fener-core = { git = "https://github.com/WertC-14/fener" }
fener-widgets = { git = "https://github.com/WertC-14/fener" }
notify = { version = "8", default-features = false }
portable-pty = "0.9"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
vt100 = "0.16"

[lints]
workspace = true
